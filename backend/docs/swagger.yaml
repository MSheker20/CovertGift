  /api/v1/ideas/{id}/reject:
    post:
      description: Sadece grup yöneticisi (admin) tarafından bir hediye fikrini doğrudan
        veto ederek durumunu 'REJECTED' yapar. Normal üyeler veto edemez (403). Fikir
        silinmez, sonraki AI çağrısına negatif kısıt olarak beslenir.
      parameters:
      - description: Hediye UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Hediye önerisi başarıyla veto edildi
          schema:
            allOf:
            - $ref: '#/definitions/controllers.Response'
            - properties:
                data:
                  $ref: '#/definitions/controllers.MessageData'
              type: object
        "400":
          description: Geçersiz hediye kimliği
          schema:
            $ref: '#/definitions/controllers.Response'
        "401":
          description: Oturum açılmamış
          schema:
            $ref: '#/definitions/controllers.Response'
        "403":
