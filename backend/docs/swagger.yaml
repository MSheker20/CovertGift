      description: Google Search ile Türkiye mağazalarında ürün ve TL fiyatı araştırır;
        kaynakla desteklenen sonuçlardan kişinin ilgi alanına uygun en fazla 5 yeni
        hediye üretir. Mevcut/veto edilmiş fikirler ve bütçe dikkate alınır. ai_sources
        araştırma kaynaklarını, ai_search_suggestions Google arama önerisi HTML'ini
        taşır; anlık stok garantisi vermez. Kaynaksız araştırma şu an 500, servis
        filtresinden sonra boş sonuç 422 döner. Geçici panel kaynak alanlarını henüz
        göstermez.
