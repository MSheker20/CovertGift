  /api/v1/ideas/{id}/vote:
    post:
      consumes:
      - application/json
      description: Bir hediye önerisine oy verir (+1 veya -1). GORM Upsert kuralı
        ile aynı kullanıcı oy verdiğinde kayıt çoğalmaz, güncellenir. Eğer toplam
        downvote sayısı grup üye sayısının yarısını aşarsa ($downvotes > N/2$) hediye
        otomatik REJECTED (Demokrasi Vetosu) olur.
      parameters:
      - description: Hediye UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: 'Oy Türü (1: Upvote, -1: Downvote)'
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.VoteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Oy başarıyla kaydedildi
          schema:
            allOf:
            - $ref: '#/definitions/controllers.Response'
            - properties:
                data:
                  $ref: '#/definitions/controllers.MessageData'
              type: object
        "400":
          description: Geçersiz oy türü (sadece 1 veya -1)
          schema:
            $ref: '#/definitions/controllers.Response'
        "401":
          description: Oturum açılmamış
          schema:
            $ref: '#/definitions/controllers.Response'
        "403":
          description: 'Erişim engellendi: Anti-Spoiler veya grup üyesi değilsiniz'
          schema:
            $ref: '#/definitions/controllers.Response'
        "404":
          description: Hediye fikri bulunamadı
          schema:
            $ref: '#/definitions/controllers.Response'
        "500":
          description: Sunucu hatası
          schema:
            $ref: '#/definitions/controllers.Response'
      security:
      - BearerAuth: []
      summary: Hediye Fikrine Oy Ver veya Güncelle (+1 Upvote / -1 Downvote)
      tags:
      - Oylama & Veto (Voting & Veto)
