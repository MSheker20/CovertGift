        aynıdır: varsayılan olarak tüm üyeler, `cover_admin_only` açıksa yalnızca
        admin. Hedef kişi 403 alır (Anti-Spoiler).'
      parameters:
      - description: Grup UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Kapak kaldırıldı
          schema:
            allOf:
            - $ref: '#/definitions/controllers.Response'
            - properties:
                data:
                  $ref: '#/definitions/controllers.MessageData'
              type: object
        "401":
          description: Oturum açılmamış
          schema:
            $ref: '#/definitions/controllers.Response'
        "403":
          description: Anti-Spoiler, üye değil veya kapak yalnızca admin'e açık
          schema:
            $ref: '#/definitions/controllers.Response'
        "404":
          description: Grup bulunamadı
          schema:
            $ref: '#/definitions/controllers.Response'
        "500":
          description: Sunucu hatası
          schema:
            $ref: '#/definitions/controllers.Response'
      security:
      - BearerAuth: []
      summary: Kapak Fotoğrafını Kaldır
      tags:
      - Grup İşlemleri (Groups)
    get:
      description: 'Kapağın baytlarını `image/jpeg` olarak döner (JSON değil). `ETag`
        grubun `cover_version` değeridir; `If-None-Match` eşleşirse 304 döner. `Cache-Control:
        private, max-age=0, must-revalidate`: tarayıcı kopyayı saklar ama her kullanımda
        sunucuya sorar, böylece yetki her seferinde yeniden denetlenir. Hedef kişi
        ve üye olmayan 403 alır; kapak yoksa 404.'
      parameters:
      - description: Grup UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Önceki yanıtın ETag değeri
        in: header
        name: If-None-Match
        type: string
      produces:
      - image/jpeg
      - application/json
      responses:
        "200":
          description: Kapak görseli (JPEG)
          schema:
            type: file
        "304":
          description: Değişmedi
        "401":
          description: Oturum açılmamış
          schema:
            $ref: '#/definitions/controllers.Response'
        "403":
          description: Anti-Spoiler veya gruba üye değilsiniz
          schema:
            $ref: '#/definitions/controllers.Response'
        "404":
          description: Grup veya kapak fotoğrafı bulunamadı
          schema:
            $ref: '#/definitions/controllers.Response'
        "500":
          description: Sunucu hatası
          schema:
            $ref: '#/definitions/controllers.Response'
      security:
      - BearerAuth: []
      summary: Kapak Fotoğrafını Getir (Anti-Spoiler Korumalı)
      tags:
      - Grup İşlemleri (Groups)
    put:
      consumes:
      - multipart/form-data
      description: 'multipart/form-data ile `file` alanında JPEG, PNG veya WebP alır:
        en fazla 2 MB, uzun kenar en çok 2000 piksel (4 megapiksel). Büyük fotoğrafı
        tarayıcı küçültür (arayüz 4:3 kırpılmış, en çok 1600x1200 JPEG gönderir);
        sunucu daha büyüğünü çözmeden reddeder. Tür, Content-Type başlığına değil
        dosyanın baytlarına göre doğrulanır; HEIC desteklenmez. Sunucu EXIF yönünü
        uygular, tüm metadata''yı (konum dahil) atar, ortadan 4:3 kırpar, en çok 1600x1200''e
        küçültür ve JPEG olarak saklar. Varsayılan olarak tüm üyeler yükleyebilir;
        `cover_admin_only` açıksa yalnızca admin. Hedef kişi 403 alır (Anti-Spoiler).
        Bildirim üretmez; grup akışına `changed` olayı gider.'
      parameters:
      - description: Grup UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Kapak görseli (JPEG, PNG veya WebP; en fazla 2 MB ve 2000 piksel
          uzun kenar)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Kapak kaydedildi
          schema:
            allOf:
            - $ref: '#/definitions/controllers.Response'
            - properties:
                data:
                  $ref: '#/definitions/controllers.CoverResponse'
              type: object
        "400":
          description: Dosya yok, görsel bozuk, çok küçük veya çözünürlüğü çok yüksek
            (uzun kenar 2000 pikselden ya da 4 megapikselden büyük)
          schema:
            $ref: '#/definitions/controllers.Response'
        "401":
          description: Oturum açılmamış
          schema:
            $ref: '#/definitions/controllers.Response'
        "403":
          description: Anti-Spoiler, üye değil veya kapak yalnızca admin'e açık
          schema:
            $ref: '#/definitions/controllers.Response'
        "404":
          description: Grup bulunamadı
          schema:
            $ref: '#/definitions/controllers.Response'
        "413":
          description: Dosya 2 MB'tan (gövde 2 MiB + 64 KiB'tan) büyük
          schema:
            $ref: '#/definitions/controllers.Response'
        "415":
          description: Desteklenmeyen görsel türü (ör. HEIC, GIF)
          schema:
            $ref: '#/definitions/controllers.Response'
        "500":
          description: Sunucu hatası
          schema:
            $ref: '#/definitions/controllers.Response'
      security:
      - BearerAuth: []
      summary: Kapak Fotoğrafı Yükle / Değiştir
      tags:
      - Grup İşlemleri (Groups)
