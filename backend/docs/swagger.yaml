basePath: /
definitions:
  controllers.AcceptInviteResponse:
    properties:
      group_id:
        format: uuid
        type: string
    type: object
  controllers.AddIdeaRequest:
    properties:
      description:
        example: Doğa yürüyüşlerinde ve kampta sıcak içecek taşımak için
        maxLength: 5000
        type: string
      estimated_price:
        example: 1450
        type: number
      image_url:
        example: https://cdn.dsmcdn.com/product.jpg
        maxLength: 500
        type: string
      product_url:
        example: https://www.trendyol.com/brand/product-p-123
        maxLength: 1000
        type: string
      search_query:
        example: Stanley klasik vakumlu termos 1 lt
        maxLength: 255
        type: string
      title:
        example: Stanley Klasik Vakumlu Termos 1.0L
        maxLength: 200
        minLength: 2
        type: string
    required:
    - title
    type: object
  controllers.AddMemberRequest:
    properties:
      email:
        example: zeynep@demo.com
        maxLength: 150
        type: string
    required:
    - email
    type: object
  controllers.ChangePasswordRequest:
    properties:
      current_password:
        example: Password123!
        maxLength: 100
        type: string
      new_password:
        description: Kayıttaki şifre kuralıyla aynıdır (RegisterRequest.Password).
        example: YeniSifre456!
        maxLength: 100
        minLength: 6
        type: string
    required:
    - current_password
    - new_password
    type: object
  controllers.CoverPolicyResponse:
    properties:
      cover_admin_only:
        example: true
        type: boolean
    type: object
  controllers.CoverResponse:
    properties:
      cover_version:
        example: 3f2a9c0d1e4b5a6978879695a4b3c2d1
        type: string
      height:
        example: 1200
        type: integer
      width:
        example: 1600
        type: integer
    type: object
  controllers.CreateGroupRequest:
    properties:
      description:
        example: Yakın arkadaşlarla ortak doğum günü hediyesi organizasyonu
        maxLength: 1000
        type: string
      event_date:
        example: "2026-12-31"
        format: date
        type: string
      target_email:
        example: ahmet@demo.com
        maxLength: 150
        type: string
      target_interests:
        example: Kamp, 3. nesil kahve demleme, trekking, outdoor
        maxLength: 2000
        type: string
      target_person_name:
        example: Ahmet
        maxLength: 100
        minLength: 2
        type: string
      target_user_id:
        example: b49770ed-7518-40e6-839d-5810f79bbd86
        format: uuid
        type: string
      title:
        example: Ahmet'in 30. Yaş Sürprizi
        maxLength: 150
        minLength: 2
        type: string
      total_budget:
        example: 2500
        type: number
    required:
    - target_person_name
    - title
    type: object
  controllers.CreateInviteRequest:
    properties:
      expires_in_days:
        enum:
        - 1
        - 7
        - 30
        example: 7
        type: integer
    required:
    - expires_in_days
    type: object
  controllers.InterestListResponse:
    properties:
      interests:
        items:
          type: string
        type: array
    type: object
  controllers.InterestRequest:
    properties:
      interest:
        example: Kamp
        type: string
    required:
    - interest
    type: object
  controllers.LinkTargetRequest:
    properties:
      email:
        example: ahmet@demo.com
        maxLength: 150
        type: string
    required:
    - email
    type: object
  controllers.LoginRequest:
    properties:
      email:
        example: can@demo.com
        type: string
      password:
        example: Password123!
        maxLength: 100
        type: string
    required:
    - email
    - password
    type: object
  controllers.LoginResponse:
    properties:
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      user:
        $ref: '#/definitions/models.User'
    type: object
  controllers.MessageData:
    properties:
      message:
        example: İşlem başarıyla tamamlandı
        type: string
    type: object
  controllers.PreviewLinkRequest:
    properties:
      url:
        example: https://ty.gl/gkyyduf4wm8u3
        maxLength: 2048
        type: string
    required:
    - url
    type: object
  controllers.RegisterRequest:
    properties:
      email:
        example: can@demo.com
        maxLength: 150
        type: string
      name:
        example: Can Yılmaz
        maxLength: 100
        minLength: 2
        type: string
      password:
        description: Şifre kuralı ChangePasswordRequest.NewPassword ile aynı tutulmalıdır.
        example: Password123!
        maxLength: 100
        minLength: 6
        type: string
    required:
    - email
    - name
    - password
    type: object
  controllers.ResetDBRequest:
    properties:
      confirm:
        example: RESET
        type: string
    type: object
  controllers.Response:
    properties:
      data: {}
      error:
        example: Hata mesajı
        type: string
      success:
        example: true
        type: boolean
    type: object
  controllers.SelectWinnerRequest:
    properties:
      idea_ids:
        example:
        - 7d1e5a3c-2f4b-4c8e-9a6d-1b2c3d4e5f60
        items:
          type: string
        maxItems: 20
        minItems: 1
        type: array
    required:
    - idea_ids
    type: object
  controllers.UpdateBudgetRequest:
    properties:
      total_budget:
        example: 3500
        type: number
    required:
    - total_budget
    type: object
  controllers.UpdateCoverPolicyRequest:
    properties:
      cover_admin_only:
        example: true
        type: boolean
    required:
    - cover_admin_only
    type: object
  controllers.UpdateDescriptionRequest:
    properties:
      description:
        example: Kampı seven Ahmet için ortak hediye. Fikirleri hafta sonuna kadar
          ekleyelim.
        maxLength: 1000
        type: string
    required:
    - description
    type: object
  controllers.UpdateEventDateRequest:
    properties:
      event_date:
        example: "2026-12-31"
        format: date
        type: string
    type: object
  controllers.UpdateProfileRequest:
    properties:
      email:
        example: can@demo.com
        maxLength: 150
        type: string
      name:
        example: Can Yılmaz
        maxLength: 100
        minLength: 2
        type: string
    required:
    - email
    - name
    type: object
  controllers.UpdateProfileResponse:
    properties:
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      user:
        $ref: '#/definitions/models.User'
    type: object
  controllers.VoteRequest:
    properties:
      vote_type:
        description: '1: Upvote, -1: Downvote'
        enum:
        - 1
        - -1
        example: 1
        type: integer
    required:
    - vote_type
    type: object
  linkpreview.Preview:
    properties:
      currency:
        type: string
      description:
        type: string
      final_url:
        type: string
      image_url:
        type: string
      partial:
        description: 'eksik/başarısız önizleme: kullanıcı formu elle doldurur'
        type: boolean
      price:
        type: string
      search_query:
        type: string
      source:
        description: trendyol | amazon | hepsiburada | generic
        type: string
      title:
        type: string
      warning:
        description: tanı veya uyarı mesajı
        type: string
    type: object
  main.HealthResponse:
    properties:
      db:
        example: up
        type: string
      status:
        example: ok
        type: string
    type: object
  models.AISource:
    properties:
      title:
        type: string
      url:
        type: string
    type: object
  models.Date:
    properties:
      time.Time:
        type: string
    type: object
  models.GiftIdea:
    properties:
      ai_search_suggestions:
        type: string
      ai_sources:
        items:
          $ref: '#/definitions/models.AISource'
        type: array
      created_at:
        type: string
      created_by:
        type: string
      creator:
        $ref: '#/definitions/models.User'
      description:
        type: string
      estimated_price:
        type: number
      group_id:
        type: string
      id:
        type: string
      image_url:
        type: string
      is_over_budget:
        description: Bütçeyi aşıyor mu uyarısı
        type: boolean
      product_url:
        description: Sadece MANUAL eklemelerde dolu
        type: string
      search_query:
        description: Pazaryerleri için arama terimi
        type: string
      source_type:
        description: '''AI'' veya ''MANUAL'''
        type: string
      status:
        description: '''ACTIVE'', ''REJECTED'', ''SELECTED'''
        type: string
      title:
        type: string
    type: object
  models.Group:
    properties:
      completed_at:
        type: string
      cover_admin_only:
        description: |-
          true ise kapak fotoğrafını yalnızca yönetici ekler/değiştirir/kaldırır; false (varsayılan)
          iken tüm üyeler yapabilir.
        type: boolean
      cover_version:
        description: |-
          Kapak fotoğrafının sürümü (group_covers.etag kopyası); fotoğraf yoksa boştur. Görselin
          baytları ayrı tabloda durur ve grup sorgularıyla hiç çekilmez; kapak değişirken aynı
          transaction'da güncellenir. İstemci bunu önbellek anahtarı olarak kullanır.
        type: string
      created_at:
        type: string
      creator:
        allOf:
        - $ref: '#/definitions/models.User'
        description: İlişkiler (Foreign Key)
      creator_id:
        type: string
      description:
        type: string
      event_date:
        allOf:
        - $ref: '#/definitions/models.Date'
        description: Hediyenin verileceği gün (doğum günü vb.). İsteğe bağlı, tek
          seferlik.
      id:
        type: string
      status:
        description: 'ACTIVE: oylama sürüyor. COMPLETED: admin kazananı seçti; fikir
          ve oy işlemleri kapalı.'
        type: string
      target_interests:
        description: Gemini AI için ilgi alanları ve hobiler
        type: string
      target_person_name:
        type: string
      target_user_id:
        description: Anti-Spoiler için kritik alan (NULL olabilir)
        type: string
      title:
        type: string
      total_budget:
        type: number
    type: object
  models.GroupMember:
    properties:
      group_id:
        type: string
      id:
        type: string
      joined_at:
        type: string
      role:
        description: '''admin'' veya ''member'''
        type: string
      user:
        $ref: '#/definitions/models.User'
      user_id:
        type: string
    type: object
  models.User:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  repository.IdeaWithScore:
    properties:
      ai_search_suggestions:
        type: string
      ai_sources:
        items:
          $ref: '#/definitions/models.AISource'
        type: array
      created_at:
        type: string
      created_by:
        type: string
      creator:
        $ref: '#/definitions/models.User'
      description:
        type: string
      estimated_price:
        type: number
      group_id:
        type: string
      id:
        type: string
      image_url:
        type: string
      is_over_budget:
        description: Bütçeyi aşıyor mu uyarısı
        type: boolean
      my_vote:
        description: 'Kullanıcının oyu: 1, -1 veya 0'
        type: integer
      product_url:
        description: Sadece MANUAL eklemelerde dolu
        type: string
      score:
        type: integer
      search_query:
        description: Pazaryerleri için arama terimi
        type: string
      source_type:
        description: '''AI'' veya ''MANUAL'''
        type: string
      status:
        description: '''ACTIVE'', ''REJECTED'', ''SELECTED'''
        type: string
      title:
        type: string
    type: object
  repository.NotificationItem:
    properties:
      created_at:
        type: string
      group_id:
        type: string
      group_title:
        example: Ahmet'in 30. Yaş Sürprizi
        type: string
      id:
        type: string
      params:
        type: object
      read_at:
        type: string
      type:
        example: idea_added
        type: string
    type: object
  services.AccountSummary:
    properties:
      id:
        format: uuid
        type: string
      name:
        example: Ahmet Yılmaz
        type: string
    type: object
  services.GroupDetailResponse:
    properties:
      group:
        $ref: '#/definitions/models.Group'
      interests:
        items:
          type: string
        type: array
      member_count:
        type: integer
      members:
        items:
          $ref: '#/definitions/models.GroupMember'
        type: array
      my_role:
        type: string
      per_person_budget:
        type: number
      target_account:
        allOf:
        - $ref: '#/definitions/services.AccountSummary'
        description: |-
          Hedef kişinin bağlı hesabı (yalnızca id + ad). Hedef bağlı değilse yer almaz. Bu yanıtı
          yalnızca üyeler alır; hedef kişinin kendisi Anti-Spoiler ile 403 alır.
    type: object
  services.GroupListItem:
    properties:
      completed_at:
        type: string
      cover_admin_only:
        description: |-
          true ise kapak fotoğrafını yalnızca yönetici ekler/değiştirir/kaldırır; false (varsayılan)
          iken tüm üyeler yapabilir.
        type: boolean
      cover_version:
        description: |-
          Kapak fotoğrafının sürümü (group_covers.etag kopyası); fotoğraf yoksa boştur. Görselin
          baytları ayrı tabloda durur ve grup sorgularıyla hiç çekilmez; kapak değişirken aynı
          transaction'da güncellenir. İstemci bunu önbellek anahtarı olarak kullanır.
        type: string
      created_at:
        type: string
      creator:
        allOf:
        - $ref: '#/definitions/models.User'
        description: İlişkiler (Foreign Key)
      creator_id:
        type: string
      description:
        type: string
      event_date:
        allOf:
        - $ref: '#/definitions/models.Date'
        description: Hediyenin verileceği gün (doğum günü vb.). İsteğe bağlı, tek
          seferlik.
      id:
        type: string
      idea_count:
        description: Reddedilmemiş fikir sayısı.
        example: 6
        type: integer
      member_count:
        example: 4
        type: integer
      pending_votes:
        description: 'Çağıran kullanıcıya özel: açık gruptaki, kendisinin eklemediği
          ve henüz oy vermediği aktif fikirler.'
        example: 2
        type: integer
      status:
        description: 'ACTIVE: oylama sürüyor. COMPLETED: admin kazananı seçti; fikir
          ve oy işlemleri kapalı.'
        type: string
      target_interests:
        description: Gemini AI için ilgi alanları ve hobiler
        type: string
      target_person_name:
        type: string
      target_user_id:
        description: Anti-Spoiler için kritik alan (NULL olabilir)
        type: string
      title:
        type: string
      total_budget:
        type: number
    type: object
  services.InviteCreated:
    properties:
      expires_at:
        type: string
      token:
        example: 3q2-7wEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        type: string
    type: object
  services.InvitePreview:
    properties:
      already_member:
        example: false
        type: boolean
      group_id:
        description: GroupID yalnızca çağıran zaten üyeyse döner; katılınca accept
          yanıtı kimliği verir.
        format: uuid
        type: string
      group_title:
        example: Ahmet'in 30. Yaş Sürprizi
        type: string
      inviter_name:
        example: Zeynep
        type: string
      member_count:
        example: 4
        type: integer
    type: object
  services.InviteStatus:
    properties:
      active:
        example: true
        type: boolean
      created_at:
        type: string
      expires_at:
        type: string
    type: object
  services.NotificationList:
    properties:
      items:
        items:
          $ref: '#/definitions/repository.NotificationItem'
        type: array
      unread_count:
        example: 3
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    name: CovertGift Geliştirici Ekibi
    url: https://github.com/MSheker20/CovertGift
  description: Arkadaş gruplarının ortak hediye organize ettiği, bütçeyi birleştirdiği,
    Gemini 3 Flash ile yapay zekâ destekli semantik hediye önerileri aldığı, önerileri
    oyladığı (+1 / -1) ve hediye alınacak kişiden süreci gizlediği (Anti-Spoiler)
    işbirlikçi web platformu REST API.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: CovertGift API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: E-posta ve şifre doğrulaması yaparak 24 saat geçerli JWT Bearer
        token ve kullanıcı profilini döner.
      parameters:
      - description: Giriş Bilgileri
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Giriş başarılı, JWT token üretildi
          schema:
            allOf:
            - $ref: '#/definitions/controllers.Response'
            - properties:
                data:
                  $ref: '#/definitions/controllers.LoginResponse'
              type: object
        "400":
          description: Geçersiz istek formatı
          schema:
            $ref: '#/definitions/controllers.Response'
        "401":
          description: Geçersiz e-posta veya şifre
          schema:
            $ref: '#/definitions/controllers.Response'
        "500":
          description: Sunucu hatası
          schema:
            $ref: '#/definitions/controllers.Response'
      summary: Kullanıcı Girişi (JWT Üretimi)
      tags:
      - Kimlik Doğrulama (Auth)
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: E-posta, şifre ve isim ile sisteme yeni bir kullanıcı hesabı kaydeder.
        Şifre bcrypt ile hashlenir.
      parameters:
      - description: Kullanıcı Kayıt Bilgileri
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Kullanıcı başarıyla oluşturuldu
          schema:
            allOf:
            - $ref: '#/definitions/controllers.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "400":
          description: Geçersiz istek parametreleri
          schema:
            $ref: '#/definitions/controllers.Response'
        "409":
          description: Bu e-posta adresi zaten kullanımda
          schema:
            $ref: '#/definitions/controllers.Response'
        "500":
          description: Sunucu hatası
          schema:
            $ref: '#/definitions/controllers.Response'
      summary: Yeni Kullanıcı Kaydı
      tags:
      - Kimlik Doğrulama (Auth)
  /api/v1/dev/reset-db:
    post:
      consumes:
      - application/json
      description: 'Tüm tabloları (users, groups, group_members, gift_ideas, votes)
        TRUNCATE CASCADE ile siler. Yalnızca API `ALLOW_DB_RESET=true` ile başlatıldıysa
        ve gövdede `{"confirm": "RESET"}` gönderilirse çalışır. Üretimde (`APP_ENV=production`)
        her durumda kapalıdır.'
      parameters:
      - description: 'Onay: confirm alanı tam olarak RESET olmalı'
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.ResetDBRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Veritabanı başarıyla sıfırlandı
          schema:
            allOf:
            - $ref: '#/definitions/controllers.Response'
            - properties:
                data:
                  $ref: '#/definitions/controllers.MessageData'
              type: object
        "400":
          description: Onay ifadesi eksik veya hatalı
          schema:
            $ref: '#/definitions/controllers.Response'
        "403":
          description: Üretim ortamı ya da ALLOW_DB_RESET kapalı
          schema:
            $ref: '#/definitions/controllers.Response'
        "500":
          description: Veritabanı sıfırlanırken hata oluştu
          schema:
            $ref: '#/definitions/controllers.Response'
      summary: Veritabanını Sıfırla (Reset Database)
      tags:
      - Sistem & Test
  /api/v1/groups:
    get:
      description: Giriş yapmış kullanıcının üye olduğu grupları listeler. Anti-Spoiler
        kuralı gereğince kullanıcının hedef kişi olduğu sürpriz gruplar bu listede
        ASLA yer almaz. Her grupta member_count, idea_count (reddedilmemiş fikirler)
        ve çağıran kullanıcıya özel pending_votes (açık gruptaki, kendisinin eklemediği
        ve henüz oy vermediği aktif fikirler) bulunur.
      produces:
      - application/json
      responses:
        "200":
          description: Kullanıcının dahil olduğu gruplar listesi
          schema:
            allOf:
            - $ref: '#/definitions/controllers.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/services.GroupListItem'
                  type: array
              type: object
        "401":
          description: Oturum açılmamış
          schema:
            $ref: '#/definitions/controllers.Response'
        "500":
          description: Sunucu hatası
          schema:
            $ref: '#/definitions/controllers.Response'
      security:
      - BearerAuth: []
      summary: Kullanıcının Gruplarını Listele (Anti-Spoiler Korumalı)
      tags:
      - Hediye Grupları (Groups)
    post:
      consumes:
      - application/json
      description: Yeni bir sürpriz hediye grubu açar ve oluşturan kullanıcıyı atomik
        transaction ile 'admin' rolüyle üye yapar. Hedef kişi isteğe bağlı `target_email`
        ile seçilir; sunucu kayıtlı kullanıcıyı bulur ve `target_user_id` alanını
        doldurur. `target_email` ve `target_user_id` birlikte gönderilemez. Hedef
        seçilmezse yalnızca `target_person_name` kullanılır ve Anti-Spoiler devreye
        girmez.
      parameters:
      - description: Grup Oluşturma Bilgileri
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.CreateGroupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Grup başarıyla oluşturuldu
          schema:
            allOf:
            - $ref: '#/definitions/controllers.Response'
            - properties:
                data:
