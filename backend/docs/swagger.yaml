      summary: Davet Önizleme
      tags:
      - Davet Linki (Invites)
  /api/v1/invites/{token}/accept:
    post:
      description: 'Çağıranı davet linkinin grubuna `member` olarak ekler (admin onayı
        yok; tamamlanmış gruba da katılınabilir). Zaten üyeyse 200 döner, yeni satır
        ve bildirim üretilmez. Yeni üye için diğer üyelere "yeni üye katıldı" bildirimi
        gider ve grup akışına `changed` olayı yayınlanır. Anti-Spoiler: çağıran hedef
        kişiyse (kontrol grup satırı kilitliyken tekrarlanır) 403 + sürpriz mesajı
        döner. Geçersiz token için 404.'
      parameters:
      - description: Davet token'ı
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Katılındı (ya da zaten üye)
          schema:
            allOf:
            - $ref: '#/definitions/controllers.Response'
            - properties:
                data:
                  $ref: '#/definitions/controllers.AcceptInviteResponse'
              type: object
        "401":
          description: Oturum açılmamış
          schema:
            $ref: '#/definitions/controllers.Response'
        "403":
          description: Anti-Spoiler
          schema:
            $ref: '#/definitions/controllers.Response'
        "404":
          description: Davet linki geçersiz veya süresi dolmuş
          schema:
            $ref: '#/definitions/controllers.Response'
        "500":
          description: Sunucu hatası
          schema:
            $ref: '#/definitions/controllers.Response'
      security:
      - BearerAuth: []
      summary: Davetle Gruba Katıl
      tags:
      - Davet Linki (Invites)
  /api/v1/me:
    delete:
      description: Oturum açmış kullanıcı kendi profilini, oluşturduğu grupları, hediye
        önerilerini ve oylarını kalıcı olarak siler.
      produces:
      - application/json
      responses:
        "200":
          description: Hesap başarıyla silindi
          schema:
            allOf:
            - $ref: '#/definitions/controllers.Response'
            - properties:
                data:
                  $ref: '#/definitions/controllers.MessageData'
              type: object
        "401":
          description: Oturum açılmamış veya geçersiz token
          schema:
            $ref: '#/definitions/controllers.Response'
        "404":
          description: Kullanıcı bulunamadı
          schema:
            $ref: '#/definitions/controllers.Response'
        "500":
          description: Sunucu hatası
          schema:
            $ref: '#/definitions/controllers.Response'
      security:
      - BearerAuth: []
      summary: Kendi Profilini ve Hesabını Sil
      tags:
      - Kimlik Doğrulama (Auth)
    get:
      description: Authorization header'ında iletilen JWT token'a ait kullanıcının
        profil bilgilerini getirir.
      produces:
      - application/json
      responses:
        "200":
          description: Kullanıcı profil bilgileri
          schema:
            allOf:
            - $ref: '#/definitions/controllers.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "401":
          description: Oturum açılmamış veya geçersiz token
          schema:
            $ref: '#/definitions/controllers.Response'
        "404":
          description: Kullanıcı bulunamadı
          schema:
            $ref: '#/definitions/controllers.Response'
        "500":
          description: Sunucu hatası
          schema:
            $ref: '#/definitions/controllers.Response'
      security:
      - BearerAuth: []
      summary: Mevcut Kullanıcı Profili
      tags:
      - Kimlik Doğrulama (Auth)
    patch:
      consumes:
      - application/json
      description: İsim ve e-postayı birlikte günceller (kayıtla aynı doğrulama kuralları).
        E-posta başka bir kullanıcıdaysa 409 döner. E-posta değiştiyse yanıt yeni
        bir JWT içerir; istemci saklı token'ı bununla değiştirmelidir.
      parameters:
      - description: Yeni isim ve e-posta
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Profil güncellendi
          schema:
            allOf:
            - $ref: '#/definitions/controllers.Response'
            - properties:
                data:
                  $ref: '#/definitions/controllers.UpdateProfileResponse'
              type: object
        "400":
          description: Geçersiz istek parametreleri
          schema:
            $ref: '#/definitions/controllers.Response'
        "401":
          description: Oturum açılmamış veya geçersiz token
          schema:
            $ref: '#/definitions/controllers.Response'
        "404":
          description: Kullanıcı bulunamadı
          schema:
            $ref: '#/definitions/controllers.Response'
        "409":
          description: Bu e-posta adresi zaten kullanımda
          schema:
            $ref: '#/definitions/controllers.Response'
        "500":
          description: Sunucu hatası
          schema:
            $ref: '#/definitions/controllers.Response'
      security:
      - BearerAuth: []
      summary: Profili Güncelle
      tags:
      - Kimlik Doğrulama (Auth)
  /api/v1/me/password:
    put:
      consumes:
      - application/json
      description: Mevcut şifre doğrulanır, yeni şifre kayıtla aynı kurallara uymalı
        ve eskisinden farklı olmalıdır. Açık oturumlar geçerli kalır.
      parameters:
      - description: Mevcut ve yeni şifre
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Şifre değiştirildi
          schema:
            allOf:
            - $ref: '#/definitions/controllers.Response'
            - properties:
                data:
                  $ref: '#/definitions/controllers.MessageData'
              type: object
        "400":
          description: Geçersiz istek, mevcut şifre hatalı veya yeni şifre eskisiyle
            aynı
          schema:
            $ref: '#/definitions/controllers.Response'
        "401":
          description: Oturum açılmamış veya geçersiz token
          schema:
            $ref: '#/definitions/controllers.Response'
        "404":
          description: Kullanıcı bulunamadı
          schema:
            $ref: '#/definitions/controllers.Response'
        "500":
          description: Sunucu hatası
          schema:
            $ref: '#/definitions/controllers.Response'
      security:
      - BearerAuth: []
      summary: Şifre Değiştir
      tags:
      - Kimlik Doğrulama (Auth)
  /api/v1/notifications:
    get:
      description: 'Giriş yapan kullanıcının en yeni 50 bildirimini (yeniden eskiye)
        ve okunmamış bildirim sayısını döner. Metin istemcide `type` ve `params` ile
        oluşturulur. Anti-Spoiler: kullanıcının hedef kişisi olduğu gruplara ait bildirimler
        hiçbir zaman üretilmez ve bu listede ayrıca süzülür.'
      produces:
      - application/json
      responses:
        "200":
          description: Bildirimler ve okunmamış sayısı
          schema:
            allOf:
            - $ref: '#/definitions/controllers.Response'
            - properties:
                data:
                  $ref: '#/definitions/services.NotificationList'
              type: object
        "401":
          description: Oturum açılmamış
          schema:
            $ref: '#/definitions/controllers.Response'
        "500":
          description: Sunucu hatası
          schema:
            $ref: '#/definitions/controllers.Response'
      security:
      - BearerAuth: []
      summary: Bildirimleri Listele (Anti-Spoiler Korumalı)
      tags:
      - Bildirimler (Notifications)
  /api/v1/notifications/{id}/read:
    post:
      description: Kullanıcının kendi bildirimini okundu olarak işaretler (tekrar
        çağırmak güvenlidir). Bildirim yoksa ya da başka bir kullanıcıya aitse 404
        döner.
      parameters:
      - description: Bildirim UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Bildirim okundu yapıldı
          schema:
            allOf:
            - $ref: '#/definitions/controllers.Response'
            - properties:
                data:
                  $ref: '#/definitions/controllers.MessageData'
              type: object
        "400":
          description: Geçersiz bildirim kimliği
          schema:
            $ref: '#/definitions/controllers.Response'
        "401":
          description: Oturum açılmamış
          schema:
            $ref: '#/definitions/controllers.Response'
        "404":
          description: Bildirim bulunamadı
          schema:
            $ref: '#/definitions/controllers.Response'
        "500":
          description: Sunucu hatası
          schema:
            $ref: '#/definitions/controllers.Response'
      security:
      - BearerAuth: []
      summary: Bildirimi Okundu Yap
      tags:
      - Bildirimler (Notifications)
  /api/v1/notifications/read-all:
    post:
      description: Giriş yapan kullanıcının okunmamış tüm bildirimlerini okundu olarak
        işaretler.
      produces:
      - application/json
      responses:
        "200":
          description: Tüm bildirimler okundu yapıldı
          schema:
            allOf:
            - $ref: '#/definitions/controllers.Response'
            - properties:
                data:
                  $ref: '#/definitions/controllers.MessageData'
              type: object
        "401":
          description: Oturum açılmamış
          schema:
            $ref: '#/definitions/controllers.Response'
        "500":
          description: Sunucu hatası
          schema:
            $ref: '#/definitions/controllers.Response'
      security:
      - BearerAuth: []
      summary: Tüm Bildirimleri Okundu Yap
      tags:
      - Bildirimler (Notifications)
  /api/v1/notifications/stream:
    get:
      description: 'Giriş yapan kullanıcıya yeni bir bildirim geldiğinde ya da bildirimleri
        okundu yapıldığında "changed" olayı gönderir. Olay veri taşımaz; istemci `GET
        /notifications` ucunu yeniden çeker (Anti-Spoiler süzgeci orada uygulanır).
        Bağlantı en fazla 5 dakika açık kalır, ardından istemci yeniden bağlanır;
        25 sn''de bir `: ping`.'
      produces:
      - text/event-stream
      responses:
        "200":
          description: 'event: changed'
          schema:
            type: string
        "401":
          description: Oturum açılmamış
          schema:
            $ref: '#/definitions/controllers.Response'
        "503":
          description: Açık bağlantı sınırı doldu
          schema:
            $ref: '#/definitions/controllers.Response'
      security:
      - BearerAuth: []
      summary: Bildirim Olay Akışı (Server-Sent Events)
      tags:
      - Bildirimler (Notifications)
  /health:
    get:
      description: API sunucusunun ve PostgreSQL veritabanı bağlantı havuzunun durumunu
        kontrol eder.
      produces:
      - application/json
      responses:
        "200":
          description: Sistem ve veritabanı çalışıyor
          schema:
            allOf:
            - $ref: '#/definitions/controllers.Response'
            - properties:
                data:
                  $ref: '#/definitions/main.HealthResponse'
              type: object
        "503":
          description: Veritabanına erişilemiyor
          schema:
            $ref: '#/definitions/controllers.Response'
      summary: Sistem ve Veritabanı Sağlık Kontrolü
      tags:
      - Sistem & Sağlık
securityDefinitions:
  BearerAuth:
    description: 'JWT Bearer token formatı: "Bearer {token}". Örnek: "Bearer eyJhbGciOiJIUzI1Ni..."'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
