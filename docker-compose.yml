services:
  db:
    image: postgres:17-alpine
    container_name: covertgift-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: covertgift
      POSTGRES_PASSWORD: covertgift_dev
      POSTGRES_DB: covertgift
    ports:
      - "5432:5432"
    volumes:
      - covertgift_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U covertgift -d covertgift"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  covertgift_pgdata:
