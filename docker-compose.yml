services:
  db:
    image: postgres:17-alpine
    container_name: covertgift-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: covertgift
      POSTGRES_PASSWORD: covertgift_dev
      POSTGRES_DB: covertgift
    ports:
      - "5432:5432"
    volumes:
      - covertgift_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U covertgift -d covertgift"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Yalnızca entegrasyon testleri için: ayrı, geçici (tmpfs) veritabanı. Gerçek veriye dokunmaz.
  # docker compose --profile test up -d test-db
  test-db:
    image: postgres:17-alpine
    container_name: covertgift-test-db
    profiles: ["test"]
    environment:
      POSTGRES_USER: covertgift
      POSTGRES_PASSWORD: covertgift_test
      POSTGRES_DB: covertgift_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U covertgift -d covertgift_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Tüm uygulamayı konteynerde çalıştırmak için (isteğe bağlı):
  #   docker compose --profile app up -d --build
  # Arayüz: http://localhost:8081 (Swagger: /swagger/index.html). API dışarıya port açmaz;
  # yalnızca web konteyneri üzerinden erişilir. Ayarlar backend/.env'den okunur
  # (JWT_SECRET zorunlu); DATABASE_URL compose ağına göre ezilir.
  api:
    build: ./backend
    container_name: covertgift-api
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: backend/.env
        required: false
    environment:
      DATABASE_URL: postgres://covertgift:covertgift_dev@db:5432/covertgift?sslmode=disable
      APP_ENV: development
      GIN_MODE: release
      # Yıkıcı sıfırlama ucu konteynerde her zaman kapalı; .env'de açık olsa bile.
      ALLOW_DB_RESET: "false"

  web:
    build: ./frontend
    container_name: covertgift-web
    profiles: ["app"]
    depends_on:
      - api
    environment:
      API_TARGET: http://api:8080
    ports:
      - "8081:5173"

volumes:
  covertgift_pgdata:
